<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Midnight Navy Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162744"/>
      <stop offset="50%" stop-color="#0e1b30"/>
      <stop offset="100%" stop-color="#060c16"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Shield Base Shape -->
  <path d="M32 4 C46 9 56 12 56 26 C56 42 46 54 32 60 C18 54 8 42 8 26 C8 12 18 9 32 4 Z"
        fill="url(#shieldBg)"
        stroke="url(#goldGrad)"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Inner Gold Inset Line -->
  <path d="M32 8 C43 12 52 15 52 27 C52 40 43 50 32 55 C21 50 12 40 12 27 C12 15 21 12 32 8 Z"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="1"
        opacity="0.6"/>

  <!-- Top Center Five-Point Star -->
  <polygon points="32 14 33.6 18.5 38.5 18.5 34.6 21.3 36.1 26 32 23.2 27.9 26 29.4 21.3 25.5 18.5 30.4 18.5"
           fill="url(#goldGrad)"/>

  <!-- Flanking Left Star -->
  <polygon points="32 14 33.6 18.5 38.5 18.5 34.6 21.3 36.1 26 32 23.2 27.9 26 29.4 21.3 25.5 18.5 30.4 18.5"
           fill="url(#goldGrad)"
           transform="translate(-10, 4) scale(0.65)"
           transform-origin="32 20"/>

  <!-- Flanking Right Star -->
  <polygon points="32 14 33.6 18.5 38.5 18.5 34.6 21.3 36.1 26 32 23.2 27.9 26 29.4 21.3 25.5 18.5 30.4 18.5"
           fill="url(#goldGrad)"
           transform="translate(10, 4) scale(0.65)"
           transform-origin="32 20"/>

  <!-- Commercial Taxi Silhouette -->
  <!-- Roof Light Sign -->
  <rect x="29" y="27" width="6" height="2.2" rx="0.8" fill="url(#goldGrad)"/>
  
  <!-- Car Cabin & Body -->
  <path d="M24 35 L26 30.5 C26.5 29.5 27.5 29.2 28.5 29.2 L35.5 29.2 C36.5 29.2 37.5 29.5 38 30.5 L40 35 L42.5 36 C43.2 36.3 43.5 37 43.5 37.8 L43.5 40 C43.5 40.8 42.8 41.5 42 41.5 L41 41.5 C41 42.8 39.8 43.8 38.5 43.8 C37.2 43.8 36 42.8 36 41.5 L28 41.5 C28 42.8 26.8 43.8 25.5 43.8 C24.2 43.8 23 42.8 23 41.5 L22 41.5 C21.2 41.5 20.5 40.8 20.5 40 L20.5 37.8 C20.5 37 20.8 36.3 21.5 36 Z"
        fill="url(#goldGrad)"/>

  <!-- Windshield Cutout -->
  <path d="M26.5 34.5 L28 31 C28.3 30.3 29 30.1 29.8 30.1 L34.2 30.1 C35 30.1 35.7 30.3 36 31 L37.5 34.5 Z"
        fill="#0e1b30"/>

  <!-- Headlights -->
  <circle cx="23.5" cy="37.5" r="1.2" fill="#fff" opacity="0.9"/>
  <circle cx="40.5" cy="37.5" r="1.2" fill="#fff" opacity="0.9"/>

  <!-- Banner Ribbon / Text -->
  <path d="M19 46 L45 46 L43.5 49.5 L20.5 49.5 Z" fill="url(#goldGrad)" opacity="0.3"/>
  <text x="32" y="49" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="4.2" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">VRINDA</text>

  <!-- Bottom Crest Wings / Laurel Accent -->
  <path d="M26 52 C28 53.5 30 54.5 32 55 C34 54.5 36 53.5 38 52"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="1.2"
        stroke-linecap="round"/>
</svg>
